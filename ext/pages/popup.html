<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="ui.css" />
    <style>
      body { width: 340px; padding: 14px; }
      header { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
      header img { width: 26px; height: 26px; }
      header h1 { font-size: 15px; }
      .status { padding: 10px 12px; margin-bottom: 10px; font-size: 13px; }
      .status b { color: #fff; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
      .grid button { width: 100%; }
      .exp { padding: 10px 12px; margin-bottom: 10px; }
      .exp label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
      .exp .row { gap: 6px; }
      select { flex: 1; }
      footer { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
      kbd { background: #1b2740; border: 1px solid var(--line); border-bottom-width: 2px;
        border-radius: 5px; padding: 1px 5px; font-size: 11px; font-family: inherit; }
    </style>
  </head>
  <body>
    <header>
      <img src="../icons/icon48.png" alt="" />
      <h1>Video Text</h1>
      <span class="pill" id="count">0 saved</span>
    </header>

    <div class="card status" id="status">Checking this page…</div>

    <div class="grid">
      <button class="primary" id="select">Select text</button>
      <button id="grab">Grab frame</button>
    </div>

    <div class="card exp">
      <label for="format">Export library as</label>
      <div class="row">
        <select id="format"></select>
        <button id="export">Save</button>
      </div>
    </div>

    <footer>
      <a href="#" id="library">Library</a>
      <span><kbd>Alt</kbd>+<kbd>S</kbd> select · <kbd>Alt</kbd>+<kbd>G</kbd> grab</span>
      <a href="#" id="options">Settings</a>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
