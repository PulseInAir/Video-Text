<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Video Text — Library</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      .wrap { max-width: 900px; margin: 0 auto; padding: 28px 20px 60px; }
      header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
      header img { width: 30px; height: 30px; }
      header h1 { font-size: 19px; }
      header .sp { flex: 1; }
      .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px; margin-bottom: 16px; }
      .bar input[type='search'] { flex: 1; min-width: 180px; }
      .item { padding: 12px 14px; margin-bottom: 10px; display: flex; gap: 12px; align-items: flex-start; }
      .item .body { flex: 1; min-width: 0; }
      .item .meta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 6px; flex-wrap: wrap; }
      .item .text { white-space: pre-wrap; word-break: break-word; outline: none; border-radius: 6px; padding: 2px 4px; }
      .item .text:focus { background: #16203450; box-shadow: 0 0 0 1px var(--accent); }
      .item .acts { display: flex; flex-direction: column; gap: 6px; }
      .item .acts button { padding: 5px 9px; font-size: 12px; }
      .empty { padding: 50px 20px; text-align: center; color: var(--muted); }
      input[type='checkbox'] { width: 16px; height: 16px; accent-color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <img src="../icons/icon48.png" alt="" />
        <h1>Video Text Library</h1>
        <span class="pill" id="count"></span>
        <span class="sp"></span>
        <button class="ghost" id="clear">Clear all</button>
      </header>

      <div class="card bar">
        <input type="search" id="q" placeholder="Search captures…" />
        <select id="source"><option value="">All sources</option></select>
        <select id="format"></select>
        <label class="row muted" style="font-size: 12px">
          <input type="checkbox" id="stamps" checked /> timestamps
        </label>
        <button class="primary" id="export">Export</button>
      </div>

      <div id="list"></div>
    </div>
    <script type="module" src="library.js"></script>
  </body>
</html>
